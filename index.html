<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>不要再忘記了</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="不要再忘記了">
<meta name="theme-color" content="#16161a">
<link rel="apple-touch-icon" href="icon-alarm-180.png">
<link rel="icon" href="icon-alarm-180.png">
<link rel="manifest" href="manifest.json">
<style>
:root {
  --bg: #f4f3ef; --card: #ffffff; --ink: #16161a; --sub: #6b6a66; --line: #e6e4dd;
  --yellow: #FFD400; --red: #e5484d; --green: #2f9e5b; --soft: #fbf6d9;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #111113; --card: #1c1c20; --ink: #f2f1ec; --sub: #9a9893; --line: #2c2c31; --soft: #2a2614; }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { min-height: 100%; }
/* 主畫面模式下 100vh 會少算狀態列高度，多加回去，確保頁面永遠比螢幕高 */
body { min-height: calc(100vh + env(safe-area-inset-top)); }
html, body { margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.5 -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", sans-serif; }
header { position: sticky; top: 0; z-index: 5; background: var(--bg);
  padding: calc(env(safe-area-inset-top) + 14px) 16px 10px; display: flex; align-items: center; gap: 10px; }
header h1 { margin: 0; font-size: 22px; letter-spacing: .5px; flex: 1; }
header h1 b { background: var(--yellow); color: #16161a; padding: 0 6px; border-radius: 6px; }
#refresh, #bell { border: 0; background: var(--card); color: var(--ink); border-radius: 999px; padding: 6px 12px; font-size: 14px; }
#stamp { font-size: 12px; color: var(--sub); padding: 0 16px 6px; display: flex; gap: 8px; }
#stamp #ver { margin-left: auto; }
#newVer { display: none; margin: 0 16px 8px; padding: 10px 14px; border: 0; border-radius: 12px; width: calc(100% - 32px);
  background: var(--yellow); color: #16161a; font-size: 15px; text-align: left; }
main { padding: 0 16px calc(env(safe-area-inset-bottom) + 90px); max-width: 640px; margin: 0 auto;
  min-height: calc(100vh - 110px); min-height: calc(100dvh - 110px); }
nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; display: flex; background: var(--card);
  border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
nav button { flex: 1; border: 0; background: none; color: var(--sub); padding: 10px 0 8px; font-size: 12px; }
nav button span { display: block; font-size: 20px; line-height: 1.2; }
nav button.on { color: var(--ink); font-weight: 700; }
nav button.on span { filter: none; }
.modes { position: sticky; top: calc(env(safe-area-inset-top) + 58px); z-index: 4; background: var(--bg);
  display: flex; gap: 6px; margin: 0 16px 6px; padding: 4px; border-radius: 12px; background: var(--card); }
.modes button { flex: 1; border: 0; background: none; color: var(--sub); padding: 8px 0; border-radius: 9px; font-size: 15px; }
.modes button.on { background: var(--yellow); color: #16161a; font-weight: 700; }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 8px; }
.cal .wd { text-align: center; font-size: 12px; color: var(--sub); padding: 2px 0; }
.cal .day { border: 0; background: var(--card); color: var(--ink); border-radius: 10px; min-height: 54px; padding: 5px 0 3px;
  display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 15px; }
.cal .day small { font-size: 11px; line-height: 1.15; }
.cal .day.today span { background: var(--red); color: #fff; border-radius: 999px; padding: 0 6px; }
.cal .day.sel { outline: 2px solid var(--yellow); outline-offset: -2px; }
.tag.soon { border-color: #f5a524; color: #c27c00; }
.todo { background: var(--card); border-radius: 16px; padding: 12px 14px; margin-bottom: 10px; display: flex; gap: 10px; align-items: center; }
.todo b { flex: 1; font-weight: 600; }
.todo small { color: var(--sub); }
.sum { display: flex; gap: 8px; margin: 4px 0 14px; }
.sum div { flex: 1; background: var(--card); border-radius: 14px; padding: 10px 12px; }
.sum b { display: block; font-size: 24px; }
.sum small { color: var(--sub); font-size: 12px; }
h2 { font-size: 15px; color: var(--sub); margin: 18px 0 8px; font-weight: 600; }
.card { background: var(--card); border-radius: 16px; padding: 12px 12px 12px 14px; margin-bottom: 10px;
  display: flex; gap: 12px; align-items: center; transition: opacity .2s; }
.card.done { opacity: .55; }
.card.done .title { text-decoration: line-through; }
.card .body { flex: 1; min-width: 0; }
.meta { font-size: 13px; color: var(--sub); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.chip { background: var(--yellow); color: #16161a; border-radius: 6px; padding: 0 6px; font-weight: 700; font-size: 12px; }
.tag { border-radius: 6px; padding: 0 6px; font-size: 12px; border: 1px solid var(--line); }
.tag.late { border-color: var(--red); color: var(--red); }
.tag.today { background: var(--red); border-color: var(--red); color: #fff; }
.tag.start { border-color: var(--yellow); background: var(--soft); }
.title { font-weight: 600; margin: 2px 0; word-break: break-all; }
.note { font-size: 13px; color: var(--sub); background: var(--soft); border-radius: 8px; padding: 4px 8px; margin-top: 4px; }
.chk { width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--line); background: none; flex: none;
  font-size: 20px; color: transparent; }
.chk.on { background: var(--green); border-color: var(--green); color: #fff; }
.chk:disabled { opacity: .3; }
.empty { text-align: center; color: var(--sub); padding: 40px 0; }
.monthbar { display: flex; align-items: center; gap: 8px; margin: 4px 0 12px; }
.monthbar button { border: 0; background: var(--card); color: var(--ink); width: 40px; height: 40px; border-radius: 50%; font-size: 18px; }
.monthbar b { flex: 1; text-align: center; font-size: 18px; }
#ip { width: 100%; margin: 0 0 12px; padding: 10px 12px; font-size: 16px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--card); color: var(--ink); -webkit-appearance: none; appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, var(--sub) 50%), linear-gradient(135deg, var(--sub) 50%, transparent 50%);
  background-position: calc(100% - 20px) 50%, calc(100% - 14px) 50%; background-size: 6px 6px; background-repeat: no-repeat; }
.clients { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.clients button { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px; padding: 6px 14px; font-size: 15px; }
.clients button.on { background: var(--yellow); border-color: var(--yellow); color: #16161a; font-weight: 700; }
.err { background: var(--card); border: 1px solid var(--red); color: var(--red); border-radius: 12px; padding: 12px; margin: 10px 0; }
.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 80px); transform: translateX(-50%);
  background: #16161a; color: #fff; padding: 8px 16px; border-radius: 999px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.show { opacity: .92; }
.skel { height: 70px; border-radius: 16px; background: var(--card); margin-bottom: 10px; animation: pulse 1.2s infinite; }
@keyframes pulse { 50% { opacity: .5; } }
</style>
</head>
<body>
<header><h1>不要再<b>忘記了</b></h1><button id="bell">🔔 開通知</button><button id="refresh">↻ 更新</button></header>
<div class="modes"><button data-mode="work">🏢 公司</button><button data-mode="home">🏠 私人</button></div>
<div id="stamp"><span id="sync"></span><span id="ver"></span></div>
<button id="newVer"></button>
<main id="view"><div class="skel"></div><div class="skel"></div><div class="skel"></div></main>
<nav></nav>
<div class="toast" id="toast"></div>
<script>
const APP_VER = '2.1';
const API = 'https://script.google.com/macros/s/AKfycbxToGnZo4NgDHqr9Ink-ZxGHRdOYRsSo6SS8ZKWtGlCFi5Gac__vxaidNUqTmZ16RW1MQ/exec';
// 鑰匙：網址有就記起來，從主畫面打開（網址沒帶）就用記住的
const KEY = (() => {
  const k = new URLSearchParams(location.search).get('k');
  try { if (k) localStorage.setItem('key', k); return k || localStorage.getItem('key') || ''; } catch (e) { return k || ''; }
})();
const VAPID = 'BGGkGdenGIVzv7BeoV4WpjqXfRqvCRin41FblMuT2KCstr4GTJhjcqWIOetZUn0ygGqNff2xjh4P3BMzGwgMtlU';   // 推播公鑰（私鑰在 GitHub Secrets）
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// 公司（穎流：Lark 交片期限＋日報、週報）／私人（TimeTree 剪片排程）各有自己的分頁
const TABS = {
  work: [['cal', '📅', '行事曆'], ['wtoday', '☀️', '今天'], ['due', '📦', '交片期限']],
  home: [['cal', '📅', '行事曆'], ['today', '☀️', '今天'], ['undone', '📋', '未完成'], ['client', '👤', 'IP']],
};
let data = null, mode = 'work', tab = 'cal', month = null, client = null, sel = null;
try {
  mode = localStorage.getItem('mode') || 'work';
  tab = localStorage.getItem('tab_' + mode) || TABS[mode][0][0];
} catch (e) {}

// ── 日期工具（跟後台同一套規則） ──
const addDays = (ymd, n) => { const d = new Date(ymd + 'T12:00:00'); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };
const md = ymd => Number(ymd.slice(5, 7)) + '/' + Number(ymd.slice(8));
const wk = ymd => '日一二三四五六'[new Date(ymd + 'T12:00:00').getDay()];
const lead = e => (e.t.indexOf('兩集') >= 0 ? 2 : 1);
const startOf = e => addDays(e.d, -lead(e));
const isDone = e => data.done.indexOf(String(e.id)) >= 0;
const tracked = e => e.d >= data.since;

// ── 跟後台拿資料 ──
async function api(params) {
  const q = new URLSearchParams(Object.assign({ k: KEY }, params));
  let last = '';
  for (let i = 0; i < 2; i++) {
    try {
      const r = await fetch(API + '?' + q.toString(), { redirect: 'follow' });
      const j = JSON.parse(await r.text());
      if (!j.ok) throw new Error(j.error || '伺服器錯誤');
      return j;
    } catch (err) { last = err.message; }
  }
  throw new Error(last);
}

async function load(quiet) {
  if (!KEY) { $('#view').innerHTML = '<div class="err">這個網址少了私人鑰匙。請用描述檔裝的「不要再忘記了」打開，或在 Telegram 對秘書打「網頁」拿完整網址。</div>'; return; }
  if (!quiet) $('#refresh').textContent = '讀取中…';
  try {
    data = await api({});
    try { localStorage.setItem('cache', JSON.stringify(data)); } catch (e) {}
    $('#sync').textContent = '已同步 · ' + new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' });
    render();
  } catch (err) {
    $('#view').insertAdjacentHTML('afterbegin', '<div class="err">讀不到資料：' + esc(err.message) + '</div>');
  } finally { $('#refresh').textContent = '↻ 更新'; }
}

async function toggle(id, btn) {
  const on = data.done.indexOf(String(id)) < 0;
  data.done = on ? data.done.concat(String(id)) : data.done.filter(x => x !== String(id));
  render();
  toast(on ? '✅ 標記完成' : '已取消完成');
  try { const j = await api({ a: 'done', id: id, v: on ? '1' : '0' }); data.done = j.done; render(); }
  catch (err) { toast('沒存到，再按一次'); data.done = on ? data.done.filter(x => x !== String(id)) : data.done.concat(String(id)); render(); }
}

// ── 畫面 ──
function card(e, extra) {
  const today = data.today, done = isDone(e);
  let tag = '';
  if (tracked(e) && !done) {
    if (e.d < today) tag = '<span class="tag late">過期 ' + Math.round((new Date(today) - new Date(e.d)) / 864e5) + ' 天</span>';
    else if (e.d === today) tag = '<span class="tag today">今天交</span>';
    else if (startOf(e) <= today) tag = '<span class="tag start">剪片中</span>';
  }
  const c = e.c;
  return '<div class="card' + (done ? ' done' : '') + '"><div class="body">' +
    '<div class="meta"><span>' + md(e.d) + '（' + wk(e.d) + '）交</span>' + (c ? '<span class="chip">' + esc(c) + '</span>' : '') + tag + (extra || '') + '</div>' +
    '<div class="title">' + esc(c ? e.s : e.t) + '</div>' +
    (e.n ? '<div class="note">📝 ' + esc(e.n) + '</div>' : '') + '</div>' +
    '<button class="chk' + (done ? ' on' : '') + '" data-id="' + esc(e.id) + '"' + (tracked(e) ? '' : ' disabled title="10/1 以前沒追蹤"') + '>✓</button></div>';
}

function summary(list) {
  const t = list.filter(tracked), ok = t.filter(isDone).length, late = t.filter(e => !isDone(e) && e.d < data.today).length;
  return '<div class="sum"><div><b>' + list.length + '</b><small>總共</small></div><div><b>' + ok + '</b><small>完成</small></div>' +
    '<div><b>' + (t.length - ok) + '</b><small>未完成</small></div><div><b style="color:var(--red)">' + late + '</b><small>過期</small></div></div>';
}

function viewToday() {
  const d = data.today, ev = data.events;
  const due = ev.filter(e => e.d === d), start = ev.filter(e => startOf(e) === d && e.d !== d);
  const late = ev.filter(e => tracked(e) && !isDone(e) && e.d < d);
  const tmr = addDays(d, 1), next = ev.filter(e => e.d === tmr || startOf(e) === tmr);
  let h = '<h2>' + md(d) + '（' + wk(d) + '）</h2>';
  if (!due.length && !start.length) h += '<div class="empty">今天沒有排到要剪或要交的片 🎉</div>';
  if (due.length) h += '<h2>🔥 今天要交</h2>' + due.map(e => card(e)).join('');
  if (start.length) h += '<h2>✂️ 今天開始剪</h2>' + start.map(e => card(e)).join('');
  if (late.length) h += '<h2>⚠️ 過了交片日還沒按完成</h2>' + late.map(e => card(e)).join('');
  if (next.length) h += '<h2>🌅 明天</h2>' + next.map(e => card(e, e.d === tmr ? '' : '<span class="tag start">明天開始剪</span>')).join('');
  return h;
}

function viewUndone() {
  const d = data.today;
  const list = data.events.filter(e => tracked(e) && !isDone(e) && startOf(e) <= d);
  if (!list.length) return '<div class="empty">目前沒有未完成的片 👍</div>';
  return '<h2>已經到了該剪的日子、還沒按完成（' + list.length + ' 支）</h2>' + list.map(e => card(e)).join('');
}

function monthBar() {
  const [y, m] = month.split('-').map(Number);
  return '<div class="monthbar"><button data-m="-1">‹</button><b>' + y + ' 年 ' + m + ' 月</b><button data-m="1">›</button></div>';
}

// 月曆：公司看 Lark 交付／外審，私人看交片／開始剪；點某天看那天的事
function dayItems(d) {
  if (mode === 'work') {
    const rows = larkRows();
    return rows.filter(r => r.plan === d).map(r => ['📦', larkCard(r)])
      .concat(rows.filter(r => r.out === d).map(r => ['👀', larkCard(r)]));
  }
  return data.events.filter(e => e.d === d).map(e => ['🎬', card(e)])
    .concat(data.events.filter(e => startOf(e) === d && e.d !== d).map(e => ['✂️', card(e, '<span class="tag start">開始剪</span>')]));
}

function viewCal() {
  const [y, m] = month.split('-').map(Number), first = new Date(y, m - 1, 1).getDay(), days = new Date(y, m, 0).getDate();
  if (!sel || sel.slice(0, 7) !== month) sel = data.today.slice(0, 7) === month ? data.today : month + '-01';
  let g = '<div class="cal">' + '日一二三四五六'.split('').map(w => '<div class="wd">' + w + '</div>').join('') + '<div></div>'.repeat(first);
  for (let i = 1; i <= days; i++) {
    const d = month + '-' + String(i).padStart(2, '0'), cnt = {};
    dayItems(d).forEach(x => { cnt[x[0]] = (cnt[x[0]] || 0) + 1; });
    const marks = Object.keys(cnt).map(k => k + (cnt[k] > 1 ? cnt[k] : '')).join('');
    g += '<button class="day' + (d === data.today ? ' today' : '') + (d === sel ? ' sel' : '') + '" data-day="' + d + '"><span>' + i + '</span><small>' + marks + '</small></button>';
  }
  const list = dayItems(sel);
  let h = monthBar() + (mode === 'work' ? larkStamp() : '') + g + '</div><h2>' + md(sel) + '（' + wk(sel) + '）</h2>' +
    (list.length ? list.map(x => x[1]).join('') : '<div class="empty">這天沒有排到事</div>');
  if (mode === 'work') {
    h += '<div class="todo"><span>📝</span><b>寫每日復盤</b><small>21:00 提醒</small></div>';
    if (wk(sel) === '五') h += '<div class="todo"><span>📋</span><b>打 IP 週報</b><small>10:00 提醒</small></div>';
  }
  return h;
}

function viewClient() {
  const names = [];
  data.events.slice().reverse().forEach(e => { if (e.c && names.indexOf(e.c) < 0) names.push(e.c); });
  if (!client || names.indexOf(client) < 0) client = names[0];
  const chips = '<div class="clients">' + names.map(n => '<button data-c="' + esc(n) + '"' + (n === client ? ' class="on"' : '') + '>' + esc(n) + '</button>').join('') + '</div>';
  const list = data.events.filter(e => e.d.slice(0, 7) === month && e.c === client);
  if (!list.length) return chips + monthBar() + '<div class="empty">' + esc(client) + ' 這個月沒有排到片</div>';
  const left = list.filter(e => tracked(e) && !isDone(e)), done = list.filter(isDone), old = list.filter(e => !tracked(e));
  return chips + monthBar() + summary(list) +
    (left.length ? '<h2>還沒完成</h2>' + left.map(e => card(e)).join('') : '') +
    (done.length ? '<h2>已完成</h2>' + done.map(e => card(e)).join('') : '') +
    (old.length ? '<h2>10/1 以前（沒追蹤）</h2>' + old.map(e => card(e)).join('') : '');
}

// ── 公司：Lark 交片期限（Mac 每天從 Lark 讀一次傳上來，只有「實際交付日」還沒填的片） ──
const larkRows = () => ((data.lark && data.lark.rows) || []).slice().sort((a, b) => (a.plan < b.plan ? -1 : 1));
const daysTo = ymd => Math.round((new Date(ymd + 'T12:00:00') - new Date(data.today + 'T12:00:00')) / 864e5);

function larkCard(r) {
  const n = daysTo(r.plan);
  const tag = n < 0 ? '<span class="tag late">超過 ' + -n + ' 天</span>' : n === 0 ? '<span class="tag today">今天交</span>' :
    n <= 5 ? '<span class="tag soon">剩 ' + n + ' 天</span>' : '<span class="tag">剩 ' + n + ' 天</span>';
  return '<div class="card"><div class="body">' +
    '<div class="meta"><span>' + md(r.plan) + '（' + wk(r.plan) + '）交付</span>' + (r.ip ? '<span class="chip">' + esc(r.ip) + '</span>' : '') + tag + '</div>' +
    '<div class="title">' + esc((r.no ? r.no + ' ' : '') + r.t) + '</div>' +
    '<div class="meta">' + (r.out ? '<span>👀 預計外審 ' + md(r.out) + '（' + wk(r.out) + '）</span>' : '') + '<span>目前：' + esc(r.s || '—') + '</span></div>' +
    '</div></div>';
}

function larkStamp() {
  if (!data.lark) return '<div class="err">還沒有 Lark 資料：Mac 開著、Chrome 有登入 Lark 時，每天 9:30 會自動傳上來。</div>';
  const at = new Date(data.lark.at), age = Math.floor((Date.now() - at) / 864e5);
  const t = (at.getMonth() + 1) + '/' + at.getDate() + ' ' + at.toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' });
  return age >= 3 ? '<div class="err">⚠️ Lark 資料 ' + age + ' 天沒更新（最後 ' + t + '），已交的片可能還列在這裡</div>'
    : '<div class="meta" style="margin-bottom:6px">Lark 資料更新於 ' + t + '</div>';
}

function viewWorkToday() {
  const d = data.today, rows = larkRows();
  const late = rows.filter(r => r.plan < d), due = rows.filter(r => r.plan === d);
  const soon = rows.filter(r => r.plan > d && daysTo(r.plan) <= 5), out = rows.filter(r => r.out === d);
  let h = '<h2>' + md(d) + '（' + wk(d) + '）</h2>' + larkStamp();
  if (late.length) h += '<h2>🔴 超過交付日還沒交</h2>' + late.map(larkCard).join('');
  if (due.length) h += '<h2>🔥 今天要交</h2>' + due.map(larkCard).join('');
  if (out.length) h += '<h2>👀 今天預計外審</h2>' + out.map(larkCard).join('');
  if (soon.length) h += '<h2>⏳ 5 天內要交</h2>' + soon.map(larkCard).join('');
  if (!late.length && !due.length && !out.length && !soon.length) h += '<div class="empty">5 天內沒有要交的片 🎉</div>';
  h += '<h2>📝 例行</h2><div class="todo"><span>📝</span><b>寫每日復盤</b><small>每天 21:00</small></div>';
  if (wk(d) === '五') h += '<div class="todo"><span>📋</span><b>打 IP 週報</b><small>今天週五 10:00</small></div>';
  return h;
}

function viewDue() {
  const rows = larkRows();
  if (!rows.length) return larkStamp() + '<div class="empty">沒有還沒交付的片 👍</div>';
  return larkStamp() + '<h2>還沒填實際交付日的片（' + rows.length + ' 支）</h2>' + rows.map(larkCard).join('') +
    '<div class="meta" style="justify-content:center;margin-top:8px">交了記得在 Lark 填「實際交付日」，下次更新就會消失</div>';
}

function render() {
  if (!data) return;
  if (!month) month = data.today.slice(0, 7);
  if (!TABS[mode].some(t => t[0] === tab)) tab = TABS[mode][0][0];
  document.querySelectorAll('.modes button').forEach(b => b.classList.toggle('on', b.dataset.mode === mode));
  document.querySelector('nav').innerHTML = TABS[mode].map(t =>
    '<button data-tab="' + t[0] + '"' + (t[0] === tab ? ' class="on"' : '') + '><span>' + t[1] + '</span>' + t[2] + '</button>').join('');
  $('#view').innerHTML = { cal: viewCal, wtoday: viewWorkToday, due: viewDue, today: viewToday, undone: viewUndone, client: viewClient }[tab]();
}

function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toast.h); toast.h = setTimeout(() => el.classList.remove('show'), 1500); }

// ── 操作 ──
document.querySelector('nav').addEventListener('click', ev => {
  const b = ev.target.closest('button'); if (!b) return;
  tab = b.dataset.tab; try { localStorage.setItem('tab_' + mode, tab); } catch (e) {}
  render(); window.scrollTo(0, 0);
});
document.querySelector('.modes').addEventListener('click', ev => {
  const b = ev.target.closest('button'); if (!b) return;
  mode = b.dataset.mode;
  try { localStorage.setItem('mode', mode); tab = localStorage.getItem('tab_' + mode) || TABS[mode][0][0]; } catch (e) { tab = TABS[mode][0][0]; }
  render(); window.scrollTo(0, 0);
});
$('#view').addEventListener('click', ev => {
  const chk = ev.target.closest('.chk');
  if (chk && !chk.disabled) return toggle(chk.dataset.id, chk);
  const mb = ev.target.closest('[data-m]');
  if (mb) { const [y, m] = month.split('-').map(Number); const d = new Date(y, m - 1 + Number(mb.dataset.m), 1);
    month = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); return render(); }
  const cb = ev.target.closest('[data-c]');
  if (cb) { client = cb.dataset.c; return render(); }
  const db = ev.target.closest('[data-day]');
  if (db) { sel = db.dataset.day; render(); }
});
$('#refresh').addEventListener('click', () => load());

// ── 通知：App 自己的推播（iPhone 要從主畫面打開、iOS 16.4 以上才能開） ──
const canPush = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
const b64u = s => Uint8Array.from(atob((s + '='.repeat((4 - s.length % 4) % 4)).replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));
async function bellState() {
  const b = $('#bell');
  if (!canPush()) { b.textContent = '🔕'; return; }
  const sub = await (await navigator.serviceWorker.ready).pushManager.getSubscription();
  b.textContent = sub && Notification.permission === 'granted' ? '🔔 已開' : '🔔 開通知';
}
async function enablePush() {
  if (!canPush()) {
    alert('這裡沒辦法開通知。\n請從主畫面上的「不要再忘記了」圖示打開，再按一次 🔔。\n（iPhone 要 iOS 16.4 以上）');
    return;
  }
  if (await Notification.requestPermission() !== 'granted') { toast('沒有允許通知，可以到 設定 → 通知 打開'); return bellState(); }
  $('#bell').textContent = '設定中…';
  try {
    const reg = await navigator.serviceWorker.ready;
    const sub = (await reg.pushManager.getSubscription()) || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64u(VAPID) });
    let j = null;
    for (let i = 0; i < 3 && !(j && j.ok); i++) {
      try { j = JSON.parse(await (await fetch(API + '?a=sub&k=' + encodeURIComponent(KEY), { method: 'POST', body: JSON.stringify(sub) })).text()); } catch (e) {}
    }
    if (!j || !j.ok) throw new Error((j && j.error) || '雲端沒回應');
    toast('✅ 通知開好了，10 分鐘內會收到一則測試通知');
  } catch (err) { toast('開通知失敗：' + err.message); }
  bellState();
}
$('#bell').addEventListener('click', enablePush);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').then(bellState).catch(() => {});
else bellState();
document.addEventListener('visibilitychange', () => { if (!document.hidden && data) load(true); });

// 版本號；GitHub 上有新版就跳黃色按鈕，點了重新載入
$('#ver').textContent = 'v' + APP_VER;
async function checkVersion() {
  try {
    const t = await (await fetch(location.pathname + '?chk=' + Date.now(), { cache: 'no-store' })).text();
    const m = t.match(/APP_VER = '([^']+)'/);
    if (m && m[1] !== APP_VER) {
      const b = $('#newVer');
      b.textContent = '🆕 有新版本 v' + m[1] + '（你現在是 v' + APP_VER + '）— 點這裡更新';
      b.style.display = 'block';
      b.onclick = () => location.replace(location.pathname + '?k=' + encodeURIComponent(KEY) + '&r=' + Date.now());
    }
  } catch (e) {}
}
checkVersion();
document.addEventListener('visibilitychange', () => { if (!document.hidden) checkVersion(); });

// 先顯示上次的資料，再去拿最新的
try { const c = JSON.parse(localStorage.getItem('cache') || 'null'); if (c && KEY) { data = c; $('#sync').textContent = '顯示上次的資料，更新中…'; render(); } } catch (e) {}
load();
</script>
</body>
</html>
